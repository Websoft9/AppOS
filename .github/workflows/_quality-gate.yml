name: Gate Runner

on:
  workflow_call:
    inputs:
      gate_stage:
        required: true
        type: string

jobs:
  gate:
    name: Gate ${{ inputs.gate_stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOLANGCI_LINT_BIN: ${{ runner.temp }}/bin/golangci-lint
      ACTIONLINT_BIN: ${{ runner.temp }}/bin/actionlint
      GOVULNCHECK_BIN: ${{ runner.temp }}/bin/govulncheck
      GITLEAKS_BIN: ${{ runner.temp }}/bin/gitleaks
      GITLEAKS_REPORT_PATH: build/reports/gitleaks-report.json
      APPOS_E2E_ARTIFACT_DIR: build/reports/e2e
      APPOS_E2E_KEEP_CONTAINER_ON_FAILURE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Prepare Go tool bin
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/package-lock.json

      - name: Install web deps
        run: cd web && npm ci

      - name: Install browser test deps
        if: inputs.gate_stage != 'pr'
        run: cd tests && npm ci

      - name: Install Playwright browsers
        if: inputs.gate_stage != 'pr'
        run: cd tests && npx playwright install --with-deps chromium

      - name: Install gate tools
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@latest
          if [ "${{ inputs.gate_stage }}" != 'pr' ]; then
            GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@latest
            GL_VERSION="8.24.2"
            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64) GL_ARCH="x64" ;;
              aarch64|arm64) GL_ARCH="arm64" ;;
              *) echo "Unsupported architecture: $ARCH" >&2; exit 1 ;;
            esac
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_${GL_ARCH}.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          fi
          if [ "${{ inputs.gate_stage }}" = 'release' ]; then
            curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$RUNNER_TEMP/bin"
          fi

      - name: Verify gate tools
        run: |
          "$RUNNER_TEMP/bin/golangci-lint" version
          "$RUNNER_TEMP/bin/actionlint" -version
          if [ "${{ inputs.gate_stage }}" != 'pr' ]; then
            "$RUNNER_TEMP/bin/govulncheck" -version
            "$RUNNER_TEMP/bin/gitleaks" version
          fi
          if [ "${{ inputs.gate_stage }}" = 'release' ]; then
            "$RUNNER_TEMP/bin/syft" version
          fi
          go version

      - name: Prepare diagnostic dirs
        run: mkdir -p build/reports/e2e build/reports

      - name: Run gate
        run: make gate "${{ inputs.gate_stage }}"

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gitleaks-report-${{ inputs.gate_stage }}-${{ github.sha }}
          path: ${{ env.GITLEAKS_REPORT_PATH }}
          if-no-files-found: ignore

      - name: Upload e2e diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-diagnostics-${{ inputs.gate_stage }}-${{ github.sha }}
          path: build/reports/e2e
          if-no-files-found: ignore

      - name: Upload release SBOM
        if: always() && inputs.gate_stage == 'release'
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: ignore

      - name: Cleanup preserved e2e containers
        if: always() && inputs.gate_stage != 'pr'
        run: docker ps -aq --filter name=appos-e2e | xargs -r docker rm -f
