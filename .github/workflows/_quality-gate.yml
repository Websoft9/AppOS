name: Gate Runner

on:
  workflow_call:
    inputs:
      gate_stage:
        required: true
        type: string

jobs:
  gate:
    name: Gate ${{ inputs.gate_stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BETTERLEAKS_REPORT_PATH: build/reports/betterleaks-report.json
      APPOS_E2E_ARTIFACT_DIR: build/reports/e2e
      APPOS_E2E_KEEP_CONTAINER_ON_FAILURE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Prepare Go tool bin
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          {
            echo "GOLANGCI_LINT_BIN=$RUNNER_TEMP/bin/golangci-lint"
            echo "ACTIONLINT_BIN=$RUNNER_TEMP/bin/actionlint"
            echo "GOVULNCHECK_BIN=$RUNNER_TEMP/bin/govulncheck"
            echo "BETTERLEAKS_BIN=$RUNNER_TEMP/bin/betterleaks"
          } >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/package-lock.json

      - name: Install web deps
        run: cd web && npm ci

      - name: Install browser test deps
        if: inputs.gate_stage != 'pr'
        run: cd tests && npm ci

      - name: Install Playwright browsers
        if: inputs.gate_stage != 'pr'
        run: cd tests && npx playwright install --with-deps chromium

      - name: Install gate tools
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@latest
          if [ "${{ inputs.gate_stage }}" != 'pr' ]; then
            GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@latest
            GOBIN="$RUNNER_TEMP/bin" go install github.com/betterleaks/betterleaks@latest
          fi

      - name: Verify gate tools
        run: |
          "$RUNNER_TEMP/bin/golangci-lint" version
          "$RUNNER_TEMP/bin/actionlint" -version
          if [ "${{ inputs.gate_stage }}" != 'pr' ]; then
            "$RUNNER_TEMP/bin/govulncheck" -version
            "$RUNNER_TEMP/bin/betterleaks" version
          fi
          go version

      - name: Debug security tool context
        if: inputs.gate_stage != 'pr'
        run: |
          set -euo pipefail
          echo "betterleaks version:"
          "$RUNNER_TEMP/bin/betterleaks" version
          echo "repo root: $(pwd)"
          echo "git sha: $(git rev-parse HEAD)"
          if [ -f .betterleaks.toml ]; then
            echo ".betterleaks.toml: present"
            ls -l .betterleaks.toml
          else
            echo ".betterleaks.toml: missing" >&2
            exit 1
          fi

      - name: Prepare diagnostic dirs
        run: mkdir -p build/reports/e2e build/reports

      - name: Start local test env for e2e gates
        if: inputs.gate_stage != 'pr'
        run: make test-env up

      - name: Run gate
        run: make gate "${{ inputs.gate_stage }}"

      - name: Trivy image scan
        if: inputs.gate_stage == 'release'
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: websoft9dev/appos:latest
          format: sarif
          output: build/reports/trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scan-type: image

      - name: Trivy image report
        if: inputs.gate_stage == 'release'
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: websoft9dev/appos:latest
          format: table
          output: build/reports/trivy-image.txt
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          scan-type: image

      - name: Generate SBOM
        if: inputs.gate_stage == 'release'
        uses: anchore/sbom-action@v0
        with:
          image: websoft9dev/appos:latest
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload Trivy SARIF
        if: always() && inputs.gate_stage == 'release'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/trivy-image.sarif

      - name: Stop local test env if present
        if: always() && inputs.gate_stage != 'pr'
        run: make test-env down || true

      - name: Upload betterleaks report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: betterleaks-report-${{ inputs.gate_stage }}-${{ github.sha }}
          path: ${{ env.BETTERLEAKS_REPORT_PATH }}
          if-no-files-found: ignore

      - name: Upload e2e diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-diagnostics-${{ inputs.gate_stage }}-${{ github.sha }}
          path: build/reports/e2e
          if-no-files-found: ignore

      - name: Upload Trivy reports
        if: always() && inputs.gate_stage == 'release'
        uses: actions/upload-artifact@v6
        with:
          name: trivy-reports-${{ github.sha }}
          path: |
            build/reports/trivy-image.sarif
            build/reports/trivy-image.txt
          if-no-files-found: ignore

      - name: Upload release SBOM
        if: always() && inputs.gate_stage == 'release'
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: ignore

      - name: Cleanup preserved e2e containers
        if: always() && inputs.gate_stage != 'pr'
        run: docker ps -aq --filter name=appos-e2e | xargs -r docker rm -f
