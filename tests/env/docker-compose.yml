services:
  ssh-target:
    image: linuxserver/openssh-server:latest
    container_name: appos-test-ssh
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      USER_NAME: appos
      USER_PASSWORD: appos123
      PASSWORD_ACCESS: true
      SUDO_ACCESS: true
    ports:
      - '127.0.0.1:2222:2222'
    healthcheck:
      test: ['CMD-SHELL', 'ss -ltn | grep -q :2222']
      interval: 10s
      timeout: 5s
      retries: 12

  mysql-target:
    image: mysql:8.4
    container_name: appos-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: apposroot
      MYSQL_DATABASE: appos_test
      MYSQL_USER: appos
      MYSQL_PASSWORD: appos123
    ports:
      - '127.0.0.1:3306:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent']
      interval: 10s
      timeout: 5s
      retries: 12

  postgres-target:
    image: postgres:16-alpine
    container_name: appos-test-postgres
    environment:
      POSTGRES_DB: appos_test
      POSTGRES_USER: appos
      POSTGRES_PASSWORD: appos123
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 12

  smtp-target:
    image: axllent/mailpit:latest
    container_name: appos-test-smtp
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8025/api/v1/info >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 12
