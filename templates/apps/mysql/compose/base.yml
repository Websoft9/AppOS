version: '3.8'

services:
  mysql:
    image: ${W9_REPO}:${W9_VERSION}
    container_name: ${W9_ID}
    hostname: ${W9_ID}
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - ${W9_DB_PORT_SET}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h localhost -p"$MYSQL_ROOT_PASSWORD" || exit 1
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:

networks:
  default:
    name: ${W9_NETWORK}
    external: true
