components:
  # Editorial grouping only:
  # - Keep the canonical catalog flat; comments and order are for human review only.
  # - Do not make loader, service, or UI logic depend on file order.
  # - Within each section, keep the most foundational component first.
  # - Within each component, keep fields in this order:
  #   1) identity metadata: component_key, target_type, label, capability
  #   2) execution contract: template_ref
  #   3) runtime binding: binary, service_name, package_name/package_names/script_path/script_url
  #   4) surface policy: description, readiness_requirements, visibility, supported_actions
  # - Example:
  #   component_key -> target_type -> label -> capability -> template_ref -> binary/service_name/package_name
  #   -> description -> readiness_requirements -> visibility -> supported_actions

  # Runtime foundation
  - component_key: docker
    target_type: server
    label: Docker
    capability: container_runtime
    artifact_kind: package
    template_ref: script-install-package-systemd
    binary: docker
    service_name: docker.service
    package_name: docker-ce
    package_names:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    package_repo_profile: docker-ce
    script_path: docker-install.sh
    description: Managed Docker Engine runtime for connected servers.
    readiness_requirements:
      - verified_os_baseline
      - root_privilege
      - network_access
      - container_runtime
      - service_manager
      - package_manager
    visibility:
      - server_operations
      - supported_software_discovery
    supported_actions:
      - install
      - upgrade
      - start
      - stop
      - restart
      - verify
      - reinstall
      - uninstall

  # Traffic edge
  - component_key: reverse-proxy
    target_type: server
    label: Reverse Proxy (Traefik)
    capability: reverse_proxy
    artifact_kind: docker
    template_ref: script-docker-systemd
    binary: docker
    version_command: "awk -F'image: ' '/image:/{print $2}' /opt/websoft9/traefik/docker-compose.yml 2>/dev/null | sed -E 's#^.*:v?##' | head -n 1"
    service_name: traefik.service
    script_path: traefik-install.sh
    description: Native Traefik agent for application public access.
    readiness_requirements:
      - verified_os_baseline
      - root_privilege
      - network_access
      - service_manager
      - package_manager
    visibility:
      - server_operations
      - supported_software_discovery
    supported_actions:
      - install
      - upgrade
      - verify
      - start
      - restart
      - stop
      - reinstall
      - uninstall

  # Observability
  - component_key: telegraf
    target_type: server
    label: Monitor Agent (Telegraf)
    capability: monitor_agent
    artifact_kind: binary
    template_ref: script-systemd
    binary: telegraf
    version_command: "telegraf version"
    service_name: appos-monitor.service
    legacy_service_names:
      - telegraf.service
    script_path: telegraf-install.sh
    description: Native Telegraf agent for AppOS metrics collector.
    readiness_requirements:
      - verified_os_baseline
      - root_privilege
      - network_access
      - service_manager
    requires_appos_base_url: true
    favorite_systemd_service: true
    visibility:
      - server_operations
      - supported_software_discovery
    supported_actions:
      - install
      - upgrade
      - verify
      - start
      - restart
      - stop
      - reinstall
      - uninstall
