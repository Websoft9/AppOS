# AppOS local platform components registry
#
# This is the single source of truth for AppOS-local built-in components.
# It serves two consumers:
# - Platform Runtime / Monitor-facing runtime inventory and service observation
# - Software Delivery local catalog projection for detect + verify surfaces
#
# Minimal runtime constraints:
# - every enabled component needs id, name, version_probe, availability_probe
# - every enabled service needs name, component_id, manager, lifecycle, visibility, and log_access
# - service components should explicitly set runtime_kind: service
# - components should declare role and owned_capability when the operator surface needs structured explanation
# - update_probe is optional and should only be declared when it represents that component's own artifact timestamp
# - dangerous operations default to false and must be explicitly enabled
#
# Software Delivery projection rules:
# - only components with software_catalog are projected into /api/software/local
# - service_name and template_ref are derived from runtime metadata, not duplicated here
# - supported_actions defaults to [verify] and visibility defaults to [local_inventory]

version: 1

components:
  - id: os
    name: OS
    enabled: true
    criticality: core
    runtime_kind: os
    role: base operating system
    owned_capability: container runtime environment
    version_probe:
      type: command
      command: ["sh", "-c", ". /etc/os-release 2>/dev/null && printf '%s\n' \"${PRETTY_NAME:-${VERSION:-${VERSION_ID:-unknown}}}\""]
    availability_probe:
      type: file_exists
      path: /etc/os-release
    operations:
      start: false
      stop: false
      restart: false
    notes: Base container operating system reported by the AppOS runtime image.

  - id: appos
    name: AppOS
    enabled: true
    criticality: core
    runtime_kind: service
    role: control-plane api
    owned_capability: appos control plane
    software_catalog:
      component_key: appos
      readiness_requirements:
        - bundled_with_appos
        - supervisor_process
    version_probe:
      type: static
      value: unknown
    availability_probe:
      type: http
      url: http://127.0.0.1/api/health
      expect_status: 200
    update_probe:
      type: file_mtime
      path: /usr/local/bin/appos
    log_access:
      type: supervisor
      service: appos
      default_stream: stdout
    operations:
      start: false
      stop: false
      restart: false
    notes: Primary backend and API service.

  - id: nginx
    name: Nginx
    enabled: true
    criticality: core
    runtime_kind: service
    role: reverse proxy
    owned_capability: web ingress
    software_catalog:
      component_key: reverse-proxy
      capability: reverse_proxy
      readiness_requirements:
        - bundled_with_appos
        - supervisor_process
    version_probe:
      type: command
      command: ["sh", "-c", "nginx -v 2>&1 | sed 's|.*nginx/||'"]
    availability_probe:
      type: command
      command: ["nginx", "-t"]
    update_probe:
      type: file_mtime
      path: /usr/sbin/nginx
    log_access:
      type: supervisor
      service: nginx
      default_stream: stdout
    operations:
      start: false
      stop: false
      restart: false
    notes: Reverse proxy and static file server.

  - id: supervisor
    name: Supervisor
    enabled: true
    criticality: core
    runtime_kind: process_manager
    role: process supervisor
    owned_capability: service orchestration
    version_probe:
      type: command
      command: ["supervisord", "-v"]
    availability_probe:
      type: file_exists
      path: /etc/supervisor/supervisord.conf
    update_probe:
      type: file_mtime
      path: /usr/bin/supervisord
    operations:
      start: false
      stop: false
      restart: false
    notes: Process manager for internal services.

  - id: redis
    name: Redis
    enabled: true
    criticality: important
    runtime_kind: service
    role: cache store
    owned_capability: background state cache
    software_catalog:
      component_key: redis
      readiness_requirements:
        - bundled_with_appos
        - supervisor_process
    version_probe:
      type: command
      command: ['sh', '-c', "redis-server --version | sed -n 's/.*v=\\([^ ]*\\).*/\\1/p'"]
    availability_probe:
      type: command
      command: ["redis-cli", "ping"]
      expect_output: PONG
    update_probe:
      type: file_mtime
      path: /usr/bin/redis-server
    log_access:
      type: supervisor
      service: redis
      default_stream: stdout
    operations:
      start: false
      stop: false
      restart: false
    notes: Internal cache/runtime dependency.

  - id: docker-cli
    name: Docker CLI
    enabled: true
    criticality: important
    runtime_kind: tool
    role: container cli
    owned_capability: container operations
    software_catalog:
      component_key: docker
      readiness_requirements:
        - bundled_with_appos
        - docker_socket_access
    version_probe:
      type: command
      command: ["docker", "version", "--format", "{{.Client.Version}}"]
    availability_probe:
      type: command
      command: ["docker", "version", "--format", "{{.Client.Version}}"]
    update_probe:
      type: file_mtime
      path: /usr/bin/docker
    operations:
      start: false
      stop: false
      restart: false
    notes: Local Docker client.

  - id: nodejs
    name: Node.js
    enabled: true
    criticality: optional
    runtime_kind: runtime
    role: javascript runtime
    owned_capability: node-based tooling
    software_catalog:
      component_key: node
      readiness_requirements:
        - bundled_with_appos
        - binary_available
    version_probe:
      type: command
      command: ["node", "-v"]
    availability_probe:
      type: command
      command: ["node", "-v"]
    update_probe:
      type: file_mtime
      path: /usr/bin/node
    operations:
      start: false
      stop: false
      restart: false
    notes: Runtime for supporting tooling.

  - id: npm
    name: npm
    enabled: true
    criticality: optional
    runtime_kind: tool
    role: node package manager
    owned_capability: node package delivery
    version_probe:
      type: command
      command: ["npm", "-v"]
    availability_probe:
      type: command
      command: ["npm", "-v"]
    update_probe:
      type: file_mtime
      path: /usr/bin/npm
    operations:
      start: false
      stop: false
      restart: false
    notes: Package manager for Node tooling.

  - id: pi-agent
    name: Pi Agent
    enabled: true
    criticality: optional
    runtime_kind: tool
    role: ai coding agent
    owned_capability: local ai assistance
    version_probe:
      type: command
      command: ["sh", "-c", "npm list -g --depth=0 @mariozechner/pi-coding-agent 2>/dev/null | tail -n 1 | sed 's|.*@||'"]
    availability_probe:
      type: command
      command: ["sh", "-c", "npm list -g --depth=0 @mariozechner/pi-coding-agent >/dev/null 2>&1"]
    update_probe:
      type: file_mtime
      path: /usr/lib/node_modules/@mariozechner/pi-coding-agent
    operations:
      start: false
      stop: false
      restart: false
    notes: AI coding assistant runtime dependency.

  - id: store-library
    name: Store Library
    enabled: true
    criticality: important
    runtime_kind: bundled_artifact
    role: app catalog bundle
    owned_capability: app catalog content
    version_probe:
      type: static
      value: unknown
    availability_probe:
      type: file_exists
      path: /appos/library
    update_probe:
      type: file_mtime
      path: /appos/library
    operations:
      start: false
      stop: false
      restart: false
    notes: App catalog bundle downloaded at build time.

  - id: victoria-metrics
    name: VictoriaMetrics
    enabled: true
    criticality: important
    runtime_kind: service
    role: metrics storage
    owned_capability: time-series persistence
    software_catalog:
      component_key: victoria-metrics
      readiness_requirements:
        - bundled_with_appos
        - supervisor_process
    version_probe:
      type: command
      command: ['sh', '-c', "victoria-metrics-prod --version 2>&1 | sed -n 's/.*v\\([0-9.]*\\).*/\\1/p' | head -n 1"]
    availability_probe:
      type: http
      url: http://127.0.0.1:8428/health
      expect_status: 200
    update_probe:
      type: file_mtime
      path: /usr/local/bin/victoria-metrics-prod
    log_access:
      type: supervisor
      service: victoriametrics
      default_stream: stdout
    operations:
      start: false
      stop: false
      restart: false
    notes: Embedded time-series database for metrics storage.

  - id: sqlite
    name: SQLite
    enabled: true
    criticality: optional
    runtime_kind: embedded_dependency
    role: embedded database engine
    owned_capability: local persistence engine
    version_probe:
      type: sqlite_query
      query: SELECT sqlite_version() AS version
    availability_probe:
      type: sqlite_query
      query: SELECT sqlite_version() AS version
    operations:
      start: false
      stop: false
      restart: false
    notes: Embedded SQLite engine used by the AppOS PocketBase runtime.

  - id: docker-compose
    name: Docker Compose
    enabled: true
    criticality: important
    runtime_kind: tool
    role: compose cli
    owned_capability: multi-container orchestration
    version_probe:
      type: command
      command: ["docker", "compose", "version", "--short"]
    availability_probe:
      type: command
      command: ["docker", "compose", "version"]
    update_probe:
      type: file_mtime
      path: /usr/lib/docker/cli-plugins/docker-compose
    operations:
      start: false
      stop: false
      restart: false
    notes: Docker Compose plugin for multi-container management.

  - id: git
    name: Git
    enabled: true
    criticality: optional
    runtime_kind: tool
    role: version control cli
    owned_capability: source retrieval
    version_probe:
      type: command
      command: ["sh", "-c", "git --version | sed 's/git version //'"]
    availability_probe:
      type: command
      command: ["git", "--version"]
    update_probe:
      type: file_mtime
      path: /usr/bin/git
    operations:
      start: false
      stop: false
      restart: false
    notes: Distributed version control system.

  - id: golang
    name: Go
    enabled: true
    criticality: optional
    runtime_kind: build_toolchain
    role: go toolchain metadata
    owned_capability: go build provenance
    version_probe:
      type: command
      command: ["sh", "-c", "grep -aoE 'go1\\.[0-9]+(\\.[0-9]+)?' /usr/local/bin/appos | head -n 1 | sed 's/^go//'"]
    availability_probe:
      type: command
      command: ["sh", "-c", "grep -aqE 'go1\\.[0-9]+(\\.[0-9]+)?' /usr/local/bin/appos"]
    operations:
      start: false
      stop: false
      restart: false
    notes: Go toolchain version embedded in the AppOS build metadata.

services:
  - name: appos
    component_id: appos
    enabled: true
    manager: supervisor
    program: appos
    declared_in: /etc/supervisor/supervisord.conf
    role: AppOS API and control-plane service.
    lifecycle: always_on
    visibility: default
    log_access:
      type: supervisor
      service: appos
      default_stream: stdout
    operations:
      start: false
      stop: false
      restart: false

  - name: redis
    component_id: redis
    enabled: true
    manager: supervisor
    program: redis
    declared_in: /etc/supervisor/supervisord.conf
    role: Internal cache and runtime dependency.
    lifecycle: always_on
    visibility: diagnostic
    log_access:
      type: supervisor
      service: redis
      default_stream: stdout
    operations:
      start: false
      stop: false
      restart: false

  - name: nginx
    component_id: nginx
    enabled: true
    manager: supervisor
    program: nginx
    declared_in: /etc/supervisor/supervisord.conf
    role: Reverse proxy and static web server.
    lifecycle: always_on
    visibility: default
    log_access:
      type: supervisor
      service: nginx
      default_stream: stdout
    operations:
      start: false
      stop: false
      restart: false

  - name: victoriametrics
    component_id: victoria-metrics
    enabled: true
    manager: supervisor
    program: victoriametrics
    declared_in: /etc/supervisor/supervisord.conf
    role: Embedded time-series metrics storage service.
    lifecycle: always_on
    visibility: diagnostic
    log_access:
      type: supervisor
      service: victoriametrics
      default_stream: stdout
    operations:
      start: false
      stop: false
      restart: false