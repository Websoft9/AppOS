services:
  appos:
    image: websoft9dev/appos:${IMAGE_TAG}
    container_name: ${CONTAINER_NAME}
    restart: ${RESTART_POLICY}
    ports:
      - "${HTTP_PORT}:9000"
      - "${TUNNEL_SSH_PORT}:2222"
      #- "${TUNNEL_PORT_START}-${TUNNEL_PORT_END}:40000-49999"
    volumes:
      - appos_data:${DATA_DIR}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=UTC
      - DATA_DIR=${DATA_DIR}
      - INIT_MODE=${INIT_MODE}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD}
      - TUNNEL_SSH_PORT=${TUNNEL_SSH_PORT}
      - REDIS_URL=${REDIS_URL}
      - TSDB_URL=${TSDB_URL}


volumes:
  appos_data:
