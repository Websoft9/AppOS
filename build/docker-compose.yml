services:
  appos:
    image: websoft9dev/appos:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-appos}
    restart: ${RESTART_POLICY:-unless-stopped}
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    ports:
      - "${HTTP_PORT:-9091}:80"
      - "${TUNNEL_SSH_PORT:-9222}:2222"
      #- "${TUNNEL_PORT_START:-40000}-${TUNNEL_PORT_END:-49999}:40000-49999"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/os-release:/host/etc/os-release:ro
      - appos_data:/appos/data
    environment:
      - NETDATA_HOST_PREFIX=/host
      - TZ=UTC
      - APPOS_SECRET_KEY=${APPOS_SECRET_KEY}
      - SUPERVISOR_PASSWORD=${SUPERVISOR_PASSWORD:-changeme}
      - INIT_MODE=${INIT_MODE:-setup}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL:-admin@example.com}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD:-changeme123}
      - TUNNEL_SSH_PORT=${TUNNEL_SSH_PORT:-9222}
      - PI_CODING_AGENT_DIR=${PI_CODING_AGENT_DIR:-/appos/data/pi}
      - TSDB_ADDR=${TSDB_ADDR:-http://127.0.0.1:8428}
      - APPOS_NETDATA_JOIN_HOST_NETNS=${APPOS_NETDATA_JOIN_HOST_NETNS:-true}

  # Optional: External reverse proxy for SSL and domain routing
  # reverse-proxy:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./proxy/nginx.conf:/etc/nginx/nginx.conf
  #     - letsencrypt:/etc/letsencrypt
  #   depends_on:
  #     - websoft9

volumes:
  appos_data:
