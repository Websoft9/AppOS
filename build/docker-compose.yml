services:
  appos:
    image: websoft9dev/appos:${IMAGE_TAG}
    container_name: ${CONTAINER_NAME}
    restart: ${RESTART_POLICY}
    ports:
      - "${HTTP_PORT}:80"
      - "${TUNNEL_SSH_PORT}:2222"
      #- "${TUNNEL_PORT_START}-${TUNNEL_PORT_END}:40000-49999"
    volumes:
      - appos_data:${DATA_DIR}
    environment:
      - TZ=UTC
      - DATA_DIR=${DATA_DIR}
      - INIT_MODE=${INIT_MODE}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD}
      - TUNNEL_SSH_PORT=${TUNNEL_SSH_PORT}
      - REDIS_URL=${REDIS_URL}
      - TSDB_URL=${TSDB_URL}

  # Optional: External reverse proxy for SSL and domain routing
  # reverse-proxy:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./proxy/nginx.conf:/etc/nginx/nginx.conf
  #     - letsencrypt:/etc/letsencrypt
  #   depends_on:
  #     - websoft9

volumes:
  appos_data:
