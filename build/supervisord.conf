[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid
user=root
# 优雅退出配置
stopwaitsecs=30
# 最小可用文件描述符
minfds=1024

; Local-only control socket for supervisorctl.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ======================
; 系统基础服务
; ======================

[program:redis]
command=/usr/bin/redis-server --appendonly yes --dir /appos/data/redis
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
user=root
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

[program:victoriametrics]
command=/usr/local/bin/victoria-metrics-prod -storageDataPath=/appos/data/victoriametrics -httpListenAddr=0.0.0.0:8428
priority=12
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
user=root
stdout_logfile=/var/log/supervisor/victoriametrics.log
stderr_logfile=/var/log/supervisor/victoriametrics-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

[program:appos]
command=/usr/local/bin/appos serve --dir /appos/data/pb/pb_data --http 127.0.0.1:8090
priority=13
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
user=root
stdout_logfile=/var/log/supervisor/appos.log
stderr_logfile=/var/log/supervisor/appos-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
environment=REDIS_ADDR="%(ENV_REDIS_ADDR)s",TSDB_ADDR="%(ENV_TSDB_ADDR)s"

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
priority=28
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
stopsignal=QUIT
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
